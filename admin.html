<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Video Call Panel</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161b22;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #00d4ff;
      --danger: #ff4757;
      --success: #2ed573;
    }

    body {
      font-family: 'Syne', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: #e6edf3;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      max-width: 1000px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #00d4ff, #009866);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #incoming-calls {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .call-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-accept { background: var(--success); color: white; }
    .btn-reject { background: var(--danger); color: white; }
    .btn-end { 
      background: var(--danger); 
      color: white; 
      display: none; 
      margin-top: 20px;
      padding: 12px 30px;
      border-radius: 50px;
    }

    #video-container {
      display: none;
      gap: 20px;
      margin-top: 20px;
      width: 100%;
      max-width: 1100px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .video-box {
      flex: 1;
      min-width: 300px;
      height: 400px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-label {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>Video Call Admin Panel</h1>
    <p style="color: #8b949e;">Trang dành cho Admin để nhận cuộc gọi video từ khách.</p>
  </div>

  <div id="incoming-calls"></div>

  <div id="video-container">
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-label">Khách</div>
    </div>
    <div class="video-box">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-label">Admin (Bạn)</div>
    </div>
  </div>

  <div style="width: 100%; text-align: center;">
    <button class="btn btn-end" id="end-call-btn">Kết thúc cuộc gọi</button>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
