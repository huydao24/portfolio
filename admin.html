<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Video Call Panel</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161b22;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #00d4ff;
      --danger: #ff4757;
      --success: #2ed573;
      --call-bg: rgba(10, 10, 10, 0.98);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Syne', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: #e6edf3;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      min-height: 100dvh;
      /* Dynamic viewport height — tránh bị thanh address bar che */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* === HEADER === */
    .header {
      width: 100%;
      max-width: 1000px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 800;
      background: linear-gradient(90deg, #00d4ff, #009866);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* === INCOMING CALLS === */
    #incoming-calls {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 0 4px;
    }

    .call-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
      font-size: 14px;
    }

    .btn-accept {
      background: var(--success);
      color: white;
    }

    .btn-reject {
      background: var(--danger);
      color: white;
    }

    .btn-end {
      background: var(--danger);
      color: white;
      display: none;
      margin-top: 20px;
      padding: 12px 30px;
      border-radius: 50px;
    }

    /* ═══════════════════════════════════════════
       VIDEO CONTAINER — Desktop mặc định
       ═══════════════════════════════════════════ */
    #video-container {
      display: none;
      gap: 20px;
      margin-top: 20px;
      width: 100%;
      max-width: 1100px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .video-box {
      flex: 1;
      min-width: 300px;
      height: 400px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-label {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
      border: 1px solid var(--glass-border);
      color: white;
      pointer-events: none;
    }

    /* Desktop controls — nhỏ gọn trên video box */
    .desktop-controls {
      position: absolute;
      bottom: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .control-btn-small {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .control-btn-small:hover {
      background: var(--surface);
    }

    .control-btn-small.is-off {
      background: var(--danger);
      border-color: var(--danger);
    }

    .video-off-placeholder {
      position: absolute;
      inset: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 5;
    }

    /* ═══════════════════════════════════════════
       MOBILE CALL CONTROLS — Floating bar
       ═══════════════════════════════════════════ */
    .mobile-call-controls {
      display: none;
      position: fixed;
      bottom: 30px;
      bottom: calc(30px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      gap: 14px;
      padding: 10px 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      z-index: 100001;
    }

    .mobile-control-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #2d3436;
      color: white;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-control-btn:active {
      transform: scale(0.92);
    }

    .mobile-control-btn.is-off {
      background: var(--danger);
      border-color: var(--danger);
    }

    .mobile-control-btn.end-call {
      background: #eb4d4b;
      width: 56px;
      height: 56px;
    }

    .mobile-control-btn.end-call:active {
      background: #ff6b81;
    }

    .mobile-control-btn .btn-label {
      font-size: 8px;
      position: absolute;
      bottom: -14px;
      white-space: nowrap;
      opacity: 0.7;
    }

    /* ═══════════════════════════════════════════
       MOBILE CALL INFO — Trạng thái cuộc gọi
       ═══════════════════════════════════════════ */
    .mobile-call-info {
      display: none;
      position: fixed;
      top: 15px;
      top: calc(15px + env(safe-area-inset-top, 0px));
      left: 15px;
      z-index: 100000;
      pointer-events: none;
    }

    .mobile-call-info h2 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      width: fit-content;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       RESPONSIVE — Chế độ full-screen khi đang gọi (≤ 1024px)
       Áp dụng cho tablet trở xuống
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 1024px) {

      body.in-call {
        padding: 0;
        overflow: hidden;
      }

      body.in-call .header,
      body.in-call #incoming-calls,
      body.in-call .end-call-wrapper {
        display: none !important;
      }

      /* Video container → full-screen overlay */
      body.in-call #video-container {
        position: fixed !important;
        inset: 0 !important;
        max-width: none !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        margin: 0 !important;
        border-radius: 0 !important;
        background: var(--call-bg) !important;
        z-index: 99999 !important;
        flex-wrap: nowrap !important;
        gap: 0 !important;
        flex-direction: column !important;
      }

      /* Remote video → full-screen */
      body.in-call .video-box.remote-box {
        position: absolute !important;
        inset: 0 !important;
        min-width: 100% !important;
        width: 100% !important;
        height: 100% !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
        z-index: 1;
      }

      /* Local video → PIP */
      body.in-call .video-box.local-box {
        position: absolute !important;
        top: 20px !important;
        top: calc(20px + env(safe-area-inset-top, 0px)) !important;
        right: 15px !important;
        width: 180px !important;
        height: auto !important;
        aspect-ratio: 3/4;
        min-width: 0 !important;
        border-radius: 16px !important;
        border: 2px solid var(--glass-border) !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
        z-index: 10 !important;
        overflow: hidden !important;
        flex: none !important;
      }

      body.in-call .video-box.local-box .video-label {
        font-size: 11px;
        bottom: 8px;
        left: 8px;
        padding: 2px 8px;
      }

      /* Ẩn desktop controls, hiện mobile controls */
      body.in-call .desktop-controls {
        display: none !important;
      }

      body.in-call .mobile-call-controls {
        display: flex !important;
      }

      body.in-call .mobile-call-info {
        display: block !important;
      }

      body.in-call #end-call-btn {
        display: none !important;
      }
    }

    /* ═══════════════════════════════════
       PHONE ≤ 768px — PIP nhỏ hơn
       ═══════════════════════════════════ */
    @media (max-width: 768px) {

      body {
        padding: 16px;
      }

      .header {
        margin-bottom: 20px;
      }

      .call-item {
        padding: 10px 12px;
        font-size: 14px;
      }

      /* PIP nhỏ hơn trên phone */
      body.in-call .video-box.local-box {
        width: 130px !important;
        top: 20px !important;
        top: calc(20px + env(safe-area-inset-top, 0px)) !important;
        right: 12px !important;
      }

      /* Controls nhỏ hơn */
      .mobile-call-controls {
        gap: 12px;
        padding: 10px 18px;
      }

      .mobile-control-btn {
        width: 46px;
        height: 46px;
      }

      .mobile-control-btn.end-call {
        width: 54px;
        height: 54px;
      }
    }

    /* ═══════════════════════════════════
       SMALL PHONE ≤ 380px — Thu gọn thêm
       ═══════════════════════════════════ */
    @media (max-width: 380px) {

      body {
        padding: 12px;
      }

      h1 {
        font-size: 18px;
      }

      .call-item {
        flex-direction: column;
        text-align: center;
        gap: 8px;
      }

      body.in-call .video-box.local-box {
        width: 100px !important;
        right: 10px !important;
      }

      .mobile-call-controls {
        gap: 8px;
        padding: 8px 14px;
        bottom: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      }

      .mobile-control-btn {
        width: 40px;
        height: 40px;
      }

      .mobile-control-btn.end-call {
        width: 48px;
        height: 48px;
      }

      .mobile-control-btn svg {
        width: 16px;
        height: 16px;
      }

      .mobile-control-btn.end-call svg {
        width: 20px;
        height: 20px;
      }

      .mobile-control-btn .btn-label {
        display: none;
      }

      .mobile-call-info h2 {
        font-size: 0.95rem;
      }
    }

    /* ═══════════════════════════════════
       LANDSCAPE trên phone — PIP sang trái
       ═══════════════════════════════════ */
    @media (max-height: 500px) and (orientation: landscape) {

      body.in-call .video-box.local-box {
        width: 120px !important;
        top: 10px !important;
        right: auto !important;
        left: 15px !important;
        left: calc(15px + env(safe-area-inset-left, 0px)) !important;
        aspect-ratio: 4/3;
      }

      .mobile-call-controls {
        bottom: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        gap: 10px;
        padding: 8px 16px;
      }

      .mobile-control-btn {
        width: 40px;
        height: 40px;
      }

      .mobile-control-btn.end-call {
        width: 48px;
        height: 48px;
      }

      .mobile-control-btn .btn-label {
        display: none;
      }

      .mobile-call-info {
        top: 8px !important;
        left: calc(150px + env(safe-area-inset-left, 0px)) !important;
      }

      .mobile-call-info h2 {
        font-size: 0.9rem;
      }
    }

    /* ═══════════════════════════════════
       TABLET 769-1024px — PIP lớn hơn
       ═══════════════════════════════════ */
    @media (min-width: 769px) and (max-width: 1024px) {

      body.in-call .video-box.local-box {
        width: 200px !important;
      }

      .mobile-control-btn {
        width: 52px;
        height: 52px;
      }

      .mobile-control-btn.end-call {
        width: 60px;
        height: 60px;
      }
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="header">
    <h1>Video Call Admin Panel</h1>
    <p style="color: #8b949e;">Trang dành cho Admin để nhận cuộc gọi video từ khách.</p>
  </div>

  <div id="incoming-calls"></div>

  <!-- Mobile Call Info (hiện khi đang gọi trên mobile) -->
  <div class="mobile-call-info" id="mobile-call-info">
    <h2>Đang gọi...</h2>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span>LIVE</span>
    </div>
  </div>

  <div id="video-container">
    <div class="video-box remote-box">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-label">Khách</div>
    </div>
    <div class="video-box local-box">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-label">Admin (Bạn)</div>

      <!-- Desktop Controls Overlay -->
      <div class="desktop-controls">
        <button class="control-btn-small" id="admin-mute-btn" title="Tắt/Bật Mic">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <button class="control-btn-small" id="admin-video-toggle-btn" title="Tắt/Bật Camera">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </button>
        <button class="control-btn-small" id="admin-flip-btn" title="Xoay Camera">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Floating Call Controls (giống bên khách) -->
  <div class="mobile-call-controls" id="mobile-call-controls">
    <button class="mobile-control-btn" id="m-admin-mute-btn" title="Tắt/Bật Mic">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
      <span class="btn-label">Mic</span>
    </button>
    <button class="mobile-control-btn" id="m-admin-video-btn" title="Tắt/Bật Camera">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 7l-7 5 7 5V7z"></path>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <span class="btn-label">Cam</span>
    </button>
    <button class="mobile-control-btn" id="m-admin-flip-btn" title="Xoay Camera">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <span class="btn-label">Flip</span>
    </button>
    <button class="mobile-control-btn end-call" id="m-admin-end-btn" title="Kết thúc cuộc gọi">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 .7.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" />
        <line x1="23" y1="1" x2="1" y2="23" />
      </svg>
    </button>
  </div>

  <div class="end-call-wrapper" style="width: 100%; text-align: center;">
    <button class="btn btn-end" id="end-call-btn">Kết thúc cuộc gọi</button>
  </div>




  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <script src="admin.js"></script>
</body>

</html>
