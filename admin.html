<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Video Call Panel</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #161b22;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #00d4ff;
      --danger: #ff4757;
      --success: #2ed573;
    }

    body {
      font-family: 'Syne', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: #e6edf3;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      max-width: 1000px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #00d4ff, #009866);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #incoming-calls {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .call-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-accept { background: var(--success); color: white; }
    .btn-reject { background: var(--danger); color: white; }
    .btn-end { 
      background: var(--danger); 
      color: white; 
      display: none; 
      margin-top: 20px;
      padding: 12px 30px;
      border-radius: 50px;
    }

    #video-container {
      display: none;
      gap: 20px;
      margin-top: 20px;
      width: 100%;
      max-width: 1100px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .video-box {
      flex: 1;
      min-width: 300px;
      height: 400px;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-label {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10;
    }

    .control-btn-small {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.5);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .control-btn-small:hover {
      background: var(--surface);
    }

    .control-btn-small.is-off {
      background: var(--danger);
      border-color: var(--danger);
    }

    .video-off-placeholder {
      position: absolute;
      inset: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 5;
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>Video Call Admin Panel</h1>
    <p style="color: #8b949e;">Trang dành cho Admin để nhận cuộc gọi video từ khách.</p>
  </div>

  <div id="incoming-calls"></div>

  <div id="video-container">
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-label">Khách</div>
    </div>
    <div class="video-box">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-label">Admin (Bạn)</div>
      
      <!-- Admin Controls Overlay -->
      <div style="position: absolute; bottom: 15px; right: 15px; display: flex; gap: 8px; z-index: 20;">
        <button class="control-btn-small" id="admin-mute-btn" title="Tắt/Bật Mic">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        <button class="control-btn-small" id="admin-video-toggle-btn" title="Tắt/Bật Camera">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
        </button>
        <button class="control-btn-small" id="admin-flip-btn" title="Xoay Camera">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        </button>

      </div>

    </div>
  </div>

  <div style="width: 100%; text-align: center;">
    <button class="btn btn-end" id="end-call-btn">Kết thúc cuộc gọi</button>
  </div>




  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
