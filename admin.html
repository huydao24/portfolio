<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Video Call Panel</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 20px;
    }
    .header {
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: #00d4ff;
    }
    #incoming-calls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .call-item {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-accept { background: #2ea043; color: white; }
    .btn-reject { background: #da3633; color: white; }
    .btn-end { background: #da3633; color: white; display: none; margin-top: 10px;}
    
    #video-container {
      display: none;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .video-box {
      flex: 1;
      min-width: 300px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #30363d;
      position: relative;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
    }
    .video-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Video Call Admin Panel</h1>
    <p>Trang dành cho Admin để nhận cuộc gọi video từ khách trên website.</p>
  </div>

  <div id="incoming-calls">
    <!-- Incoming calls will appear here -->
  </div>

  <div id="video-container">
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="video-label">Khách</div>
    </div>
    <div class="video-box">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-label">Admin (Bạn)</div>
    </div>
    <div style="width: 100%; text-align: center;">
      <button class="btn btn-end" id="end-call-btn">Kết thúc cuộc gọi</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4/dist/socket.io.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
